<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BIXPO 2026 리플렛</title>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="referrer" content="no-referrer">
<meta property="og:title" content="BIXPO 2026 · MTAS AI 리플렛">
<meta property="og:description" content="리플렛의 QR 코드로 열람할 수 있습니다">
<meta name="theme-color" content="#0b1a3f">
<style>
:root{--bg:#0b1a3f;--fg:#fff;--muted:rgba(255,255,255,.55);--accent:#f7b52c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);
  font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden}
.track{display:flex;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;
  display:flex;align-items:center;justify-content:center;padding:12px 12px 64px;position:relative}
.page::before{content:"불러오는 중…";position:absolute;inset:0 0 52px;display:grid;place-items:center;font-size:13px;color:var(--muted)}
.page.failed::before{content:"이 면을 불러오지 못했습니다. 새로고침해 주세요."}
.page img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.45);
  background:#fff;display:block;user-select:none;-webkit-user-drag:none;position:relative}
.bar{position:fixed;left:0;right:0;bottom:0;height:56px;padding-bottom:env(safe-area-inset-bottom);
  display:flex;align-items:center;justify-content:center;gap:14px}
.label{font-size:13px;color:var(--muted);text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
.label b{color:var(--fg);font-weight:700;margin-left:4px}
.dots{display:flex;gap:6px}
.dots button{width:7px;height:7px;border-radius:50%;border:0;background:rgba(255,255,255,.3);cursor:pointer;padding:0}
.dots button[aria-current="true"]{background:var(--accent);width:20px;border-radius:4px}
.nav{position:fixed;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;
  background:rgba(255,255,255,.12);color:#fff;font-size:20px;cursor:pointer;display:none}
.nav.prev{left:16px}.nav.next{right:16px}
.nav:disabled{opacity:.25;cursor:default}
@media (hover:hover) and (min-width:700px){.viewer .nav{display:block}}
.hint{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);font-size:12px;color:#fff;
  background:rgba(0,0,0,.55);padding:7px 14px;border-radius:20px;pointer-events:none;transition:opacity .6s}
.hint.off{opacity:0}
.locked{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px}
.locked h1{font-size:18px;font-weight:700;margin-bottom:10px}
.locked p{font-size:14px;line-height:1.6;color:var(--muted)}
body.is-locked .locked{display:grid}
body:not(.viewer) .bar, body:not(.viewer) .hint{display:none}
</style>
</head>
<body>
<main class="track" id="track" aria-label="리플렛 페이지"></main>

<button class="nav prev" id="prev" aria-label="이전 페이지">‹</button>
<button class="nav next" id="next" aria-label="다음 페이지">›</button>
<div class="hint" id="hint">옆으로 넘겨 보세요 →</div>

<nav class="bar">
  <span class="label" id="label"></span>
  <div class="dots" id="dots"></div>
</nav>

<section class="locked" role="alert">
  <div>
    <h1>리플렛의 QR 코드로 열어 주세요</h1>
    <p>이 페이지는 BIXPO 2026 현장에서 배포한<br>리플렛의 QR 코드로만 열람할 수 있습니다.</p>
  </div>
</section>

<script>
// 리플렛 이미지는 data/ 에 AES-GCM 암호문으로만 올라가 있고,
// 열쇠는 QR 주소의 # 뒤에만 있다 (# 뒤는 서버로 전송되지 않음).
const track = document.getElementById("track");
const dots = document.getElementById("dots");
const label = document.getElementById("label");
const prev = document.getElementById("prev");
const next = document.getElementById("next");
const hint = document.getElementById("hint");
let PAGES = [];
let cur = 0;

const fromB64u = s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));

function lock() {
  document.body.classList.add("is-locked");
  document.title = "BIXPO 2026 리플렛";
}

async function unlock() {
  const k = location.hash.slice(1);
  if (!/^[A-Za-z0-9_-]{22}$/.test(k)) return null;
  try {
    return await crypto.subtle.importKey("raw", fromB64u(k), "AES-GCM", false, ["decrypt"]);
  } catch { return null; }
}

async function fetchPlain(key, name) {
  const res = await fetch("data/" + name, { cache: "no-cache" });
  if (!res.ok) throw new Error(res.status);
  const buf = new Uint8Array(await res.arrayBuffer());
  return crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, key, buf.slice(12));
}

function current() {
  const w = track.clientWidth;   // 화면이 아직 그려지기 전이면 0
  return w ? Math.max(0, Math.min(PAGES.length - 1, Math.round(track.scrollLeft / w))) : 0;
}
function go(i) {
  i = Math.max(0, Math.min(PAGES.length - 1, i));
  track.scrollTo({ left: i * track.clientWidth, behavior: "smooth" });
}
function render() {
  cur = current();
  label.innerHTML = `MTAS AI 소개 리플렛 <b>${cur + 1}</b> / ${PAGES.length}`;
  [...dots.children].forEach((d, i) => d.setAttribute("aria-current", i === cur));
  prev.disabled = cur === 0;
  next.disabled = cur === PAGES.length - 1;
  if (cur > 0) hint.classList.add("off");
}

function build(key) {
  document.body.classList.add("viewer");
  document.title = "MTAS AI 리플렛";
  PAGES.forEach((p, i) => {
    const sec = document.createElement("section");
    sec.className = "page";
    const img = document.createElement("img");
    img.alt = `${i + 1}면 · ${p.t}`;
    sec.appendChild(img);
    track.appendChild(sec);
    // 표지부터 순서대로 받아 풀되, 기다리지 않고 모두 바로 시작
    fetchPlain(key, p.f).then(plain => {
      img.src = URL.createObjectURL(new Blob([plain], { type: "image/jpeg" }));
    }).catch(() => sec.classList.add("failed"));

    const d = document.createElement("button");
    d.setAttribute("aria-label", `${i + 1}면으로 이동`);
    d.onclick = () => go(i);
    dots.appendChild(d);
  });

  track.addEventListener("scroll", () => requestAnimationFrame(render), { passive: true });
  prev.onclick = () => go(cur - 1);
  next.onclick = () => go(cur + 1);
  addEventListener("keydown", e => {
    if (e.key === "ArrowRight") go(cur + 1);
    if (e.key === "ArrowLeft") go(cur - 1);
  });
  addEventListener("resize", () => track.scrollTo({ left: cur * track.clientWidth }));
  setTimeout(() => hint.classList.add("off"), 3500);
  render();
}

(async () => {
  const key = await unlock();
  if (!key) return lock();
  try {
    PAGES = JSON.parse(new TextDecoder().decode(await fetchPlain(key, "manifest.bin"))).pages;
  } catch { return lock(); }   // 열쇠가 틀리면 복호화 단계에서 실패
  build(key);
})();
</script>
</body>
</html>
